# mph.toml — mọi pin version/đường dẫn nằm ở đây, không hardcode trong code
[paths]
sdk = 'C:/Users/sonnt/AppData/Local/Android/Sdk'
git_bash = 'C:/Program Files/Git/bin/bash.exe'
burp_bin = 'C:/Program Files/Burp/bin'

[avd]
name = "mph_avd"
image = "system-images;android-34;google_apis;x86_64"

[proxy]
# 8080 = listener mặc định Burp mở khi launch headless (--project-file=).
# Burp 2026.1 bỏ qua request_listeners qua --config-file → phải dùng đúng
# port mặc định đó. Trước đây tưởng 8080 bị Docker/WSL chiếm: thực tế
# wslrelay chỉ giữ IPv6 ::1; IPv4 127.0.0.1:8080 trống (Burp bind được).
port = 8080
burp_mcp_port = 9876

[workspace]
root = "workspace"

[root]
# Ruling 2026-10-07: chiteroman/jyotidwi PIF + strongR binary bi GitHub dọn (404/rỗng)
# → resolve qua API; PIF living source = osm0sis/PlayIntegrityFork
magisk_slug  = "topjohnwu/Magisk"
shamiko_slug = "LSPosed/LSPosed.github.io"
pif_slugs    = ["osm0sis/PlayIntegrityFork", "chiteroman/PlayIntegrityFork", "jyotidwi/PlayIntegrityFix"]

[frida]
engine           = "stock"   # stock = frida chính chủ + rename alias (strongR chưa có nguồn binary)
client_ver       = "auto"    # auto = lấy theo pip frida đang cài
server_url_tpl   = 'https://github.com/frida/frida/releases/download/{ver}/frida-server-{ver}-android-x86_64.xz'
alias            = "sysmondd"
# 27042 = frida default (client -U phụ thuộc); đổi thì phải dùng forward+-H (P4)
port             = 27042

[vendor]
spic_slug   = "herzhenr/spic-android"
rootavd_url = 'https://gitlab.com/newbit/rootAVD/-/archive/master/rootAVD-master.tar.gz'

[re]
jadx_bin  = 'C:/Users/sonnt/Documents/JADX/bin/jadx.bat'  # abs path — PATH resolve không ổn định qua Git Bash
index_cmd = 'C:/Users/sonnt/AppData/Local/Programs/codebase-memory-mcp/codebase-memory-mcp.exe'
index_mode = "moderate"
